# Atualizações de dependências: no máximo um PR por mês para cada área (app, backend, Actions).
#
# - Só atualizações pequenas (minor e patch), todas juntas num PR. Atualizações grandes
#   (major) mudam comportamento e são feitas à mão.
# - O Expo fixa versões compatíveis entre si: Expo/React Native são atualizados à mão
#   (npx expo install --fix).
# - As bibliotecas de criptografia do backup (@noble/*) só são atualizadas à mão, com os
#   testes de backup e restauração de arquivos antigos.
# - Falhas de segurança continuam chegando como alerta (aba Security → Dependabot alerts).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native*'
      - dependency-name: '@react-native/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: '@noble/*'
    groups:
      app:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      backend:
        patterns: ['*']
